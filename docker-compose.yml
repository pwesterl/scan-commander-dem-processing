services:
  preprocess_worker:
    build:
      context: ../geoint-dem-detection
      dockerfile: Dockerfile
    image: ghcr.io/scatod/scan-commander-dem-processing/preprocess-worker:latest
    working_dir: /app 
    command: ["/app/start_preprocess.sh"] 
    environment:
      TOOLS_DIR: /app/geoint-dem-detection/tools
      PYTHONPATH: /app/geoint-dem-detection/tools:/app/geoint-dem-detection/model:/app/geoint-dem-detection
      DELIVERY_YEAR: ${DELIVERY_YEAR}
      SCAN_ELAN_ORTO_DIR: /app/data/image-process-2026_test/orto
      TEMP_DIR: /app/temp
      DATA_ROOT: /app/data/
      DB_FILE: /app/data/db/inference.db
      RABBITMQ_HOST_INTERNAL: rabbitmq
      RABBITMQ_HOST: grizzly-rabbitmq
    volumes:
      - .:/app:cached
      - ../geoint-dem-detection:/app/geoint-dem-detection:ro
      - logs_volume:/app/logs
      - /skog-nas01/scan-data:/app/data:rw
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - grizzly
    cpuset: "96-103"
    restart: unless-stopped
    deploy:
      replicas: 1

  inference_worker:
    build:
      context: ../geoint-dem-detection
      dockerfile: Dockerfile
    image: ghcr.io/scatod/scan-commander-dem-processing/inference-worker:latest
    working_dir: /app
    command: ["/app/start_inference.sh"] 
    environment:
      INFERENCE_SCRIPT_DIR: /app/geoint-dem-detection/model
      TOOLS_SCRIPT_DIR: /app/geoint-dem-detection/tools
      ROOT_GEOINT_DIR: /app/geoint-dem-detection
      PYTHONPATH: /app/geoint-dem-detection/tools:/app/geoint-dem-detection/model:/app/geoint-dem-detection
      NVIDIA_VISIBLE_DEVICES: MIG-36a9c625-6386-5e93-818e-22ce3c7c124b
      MODEL_PATH: /app/data/models/DEMProcessing
      RABBITMQ_HOST_INTERNAL: rabbitmq
      RABBITMQ_HOST: grizzly-rabbitmq
      RUN_KOLBOTTEN: ${RUN_KOLBOTTEN}
      RUN_FANGSTGROP: ${RUN_FANGSTGROP}
      RUN_MYR: ${RUN_MYR}
      RUN_BACK: ${RUN_BACK}
      RUN_VAGAR: ${RUN_VAGAR}
      RUN_VAGAR_KORSPAR: ${RUN_VAGAR_KORSPAR}
      RUN_KORSPAR: ${RUN_KORSPAR}
      TORCH_HOME: /app/.cache/torch
    volumes:
      - .:/app:cached
      - ../geoint-dem-detection:/app/geoint-dem-detection:ro
      - logs_volume:/app/logs
      - /skog-nas01/scan-data:/app/data:rw
      - ./cache/torch:/app/.cache/torch
      - temp_output:/app/temp_output
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - grizzly

    cpuset: "104-111"
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["MIG-36a9c625-6386-5e93-818e-22ce3c7c124b"]
              capabilities: [gpu]
      

volumes:
  logs_volume:
    driver: local
  temp_output:
    driver: local
networks:
  geoint:
    driver: bridge
  grizzly:
    external: true